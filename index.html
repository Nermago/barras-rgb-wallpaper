<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barras RGB</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f1a; }
  #fallback {
    position: fixed; inset: 0;
    background: linear-gradient(120deg, #2b1d4a, #14324a, #3a1f3d, #1b2f45);
    background-size: 400% 400%;
    animation: shift 30s ease infinite;
  }
  @keyframes shift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  #bg { position: fixed; inset: 0; }
  #bg.blurred { inset: -20px; } /* margen extra solo con desenfoque, para que no queden bordes */
  #bg img, #bg video { width: 100%; height: 100%; object-fit: cover; display: none; }
  #dim { position: fixed; inset: 0; background: #000; opacity: .15; pointer-events: none; }
  /* Las barras solo ocupan la franja de abajo: menos píxeles que dibujar en cada cuadro. */
  #glow, #viz { position: fixed; left: 0; bottom: 0; width: 100%; pointer-events: none; }
  #glow { filter: blur(14px); }
  #notice {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 10px; background: rgba(0,0,0,.7); color: #fff;
    font: 14px system-ui, sans-serif; display: none;
  }
</style>
</head>
<body>
<div id="fallback"></div>
<div id="bg">
  <img id="bgImg" alt="">
  <video id="bgVid" muted loop playsinline preload="auto" disablepictureinpicture></video>
</div>
<div id="dim"></div>
<canvas id="glow"></canvas>
<canvas id="viz"></canvas>
<div id="notice"></div>

<script>
// Valores por defecto. Deben coincidir con LivelyProperties.json y project.json.
const cfg = {
  bgType: 0,               // 0 imagen, 1 video, 2 degradado animado
  imgFile: "images/default.svg",
  vidFile: "",
  videoAudio: false,
  videoVolume: 50,
  dim: 15,
  blur: 0,
  barCount: 96,
  barHeight: 35,
  gap: 35,
  opacity: 55,
  saturation: 85,
  lightness: 78,
  colorSpeed: 25,
  glow: 45,
  sensitivity: 100,
  smoothing: 60,
  mirror: true,
  peaks: true,
  rounded: true,
  idleWave: true,
  autoGain: true
};

const imgEl = document.getElementById("bgImg");
const vidEl = document.getElementById("bgVid");
const bgEl = document.getElementById("bg");
const dimEl = document.getElementById("dim");
const noticeEl = document.getElementById("notice");
const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d");
const glowCanvas = document.getElementById("glow");
const gctx = glowCanvas.getContext("2d");

// Lively usa WebView2. Wallpaper Engine expone wallpaperRegisterAudioListener.
const inLively = !!(window.chrome && window.chrome.webview);
const inWE = typeof window.wallpaperRegisterAudioListener === "function";
// Demo con audio simulado: en un navegador normal (fuera de Lively y Wallpaper Engine)
// o forzada con ?demo en la URL. Se desactiva con ?nodemo (para apps sin audio).
const params = new URLSearchParams(location.search);
const demoMode = params.has("demo") || (!inLively && !inWE && !params.has("nodemo"));

function showNotice(text) {
  noticeEl.textContent = text;
  noticeEl.style.display = "block";
  clearTimeout(showNotice.t);
  showNotice.t = setTimeout(() => noticeEl.style.display = "none", 8000);
}

// ---------- Fondo ----------
function toUrl(val, folder) {
  if (!val) return "";
  if (/^(file|https?):/i.test(val)) return val; // ruta absoluta (Wallpaper Engine)
  let p = String(val).replace(/\\/g, "/");
  if (!p.includes("/")) p = folder + "/" + p;
  return p.split("/").map(encodeURIComponent).join("/");
}

function wantVideo() {
  return cfg.bgType === 1 && !!vidEl.getAttribute("src");
}

function applyVideoAudio() {
  vidEl.volume = Math.min(1, Math.max(0, cfg.videoVolume / 100));
  vidEl.muted = !cfg.videoAudio;
}

function playVideo() {
  if (!wantVideo()) return;
  vidEl.play().catch(() => {
    // Si no deja reproducir con sonido, sigue sin sonido para que el video no se quede quieto.
    if (!vidEl.muted) { vidEl.muted = true; vidEl.play().catch(() => {}); }
  });
}

function applyBackground() {
  const imgUrl = toUrl(cfg.imgFile, "images");
  const vidUrl = toUrl(cfg.vidFile, "videos");

  if (cfg.bgType === 1 && vidUrl) {
    if (vidEl.getAttribute("src") !== vidUrl) {
      vidEl.src = vidUrl;
      vidEl.load();
    }
    applyVideoAudio();
    imgEl.style.display = "none";
    vidEl.style.display = "block";
    playVideo();
  } else {
    // Solo descarga el video si había uno puesto (no en cada cambio de ajuste).
    if (vidEl.getAttribute("src")) {
      vidEl.pause();
      vidEl.removeAttribute("src");
      vidEl.load();
    }
    vidEl.style.display = "none";
    if (cfg.bgType !== 2 && imgUrl) {
      if (imgEl.getAttribute("src") !== imgUrl) imgEl.src = imgUrl;
      imgEl.style.display = "block";
    } else {
      imgEl.style.display = "none";
    }
  }
  bgEl.classList.toggle("blurred", cfg.blur > 0);
  bgEl.style.filter = cfg.blur > 0 ? `blur(${cfg.blur}px)` : "none";
  dimEl.style.opacity = cfg.dim / 100;
}

vidEl.addEventListener("error", () => {
  if (vidEl.getAttribute("src")) {
    showNotice("Este video no es compatible. Conviértelo a MP4 (H.264) o WebM.");
  }
});

// Vigilante: si el video se pausa solo o se queda congelado (por ejemplo, después de que
// Lively pause el fondo al abrir un juego), lo vuelve a poner en marcha.
let lastTime = -1, stuckCount = 0;
setInterval(() => {
  if (!wantVideo() || document.hidden) { stuckCount = 0; return; }
  if (vidEl.paused) { playVideo(); return; }
  if (vidEl.readyState >= 2 && vidEl.currentTime === lastTime) {
    if (++stuckCount >= 2) {
      vidEl.currentTime = (vidEl.currentTime + 0.05) % (vidEl.duration || 1);
      playVideo();
      stuckCount = 0;
    }
  } else {
    stuckCount = 0;
  }
  lastTime = vidEl.currentTime;
}, 1500);

document.addEventListener("visibilitychange", () => { if (!document.hidden) playVideo(); });

// Lively llama a esta función con cada ajuste del panel "Personalizar".
function livelyPropertyListener(name, val) {
  if (!(name in cfg)) return;
  if (typeof cfg[name] === "number") val = Number(val);
  if (typeof cfg[name] === "boolean") val = (val === true || val === "true");
  cfg[name] = val;
  if (["bgType", "imgFile", "vidFile", "blur", "dim"].includes(name)) applyBackground();
  if (name === "videoAudio" || name === "videoVolume") { applyVideoAudio(); playVideo(); }
  if (name === "barCount") resetBars();
  if (name === "barHeight" || name === "glow") resize();
}

// ---------- Audio ----------
let raw = new Float32Array(128);
let lastAudio = 0;        // última vez que llegó sonido de verdad (no solo silencio)
const SOUND_MIN = 0.002;  // por debajo de esto se considera silencio

// Ajuste automático de volumen: recuerda qué tan fuerte llega el audio y escala las barras,
// para que sigan el ritmo aunque la música suene bajito (por ejemplo, por HDMI o con poco volumen).
let gainRef = 0.3, lastGainT = 0;

// Lively envía aquí el espectro del audio que suena en el PC (Spotify, YouTube, etc.).
function livelyAudioListener(arr) {
  if (!arr || !arr.length) return;
  if (raw.length !== arr.length) raw = new Float32Array(arr.length);
  let m = 0;
  for (let i = 0; i < arr.length; i++) { raw[i] = arr[i]; if (arr[i] > m) m = arr[i]; }
  const now = performance.now();
  if (m > SOUND_MIN) lastAudio = now;
  const dt = lastGainT ? Math.min(0.2, (now - lastGainT) / 1000) : 0;
  lastGainT = now;
  if (m > gainRef) gainRef += (m - gainRef) * 0.5;               // sube rápido con golpes fuertes
  else gainRef = Math.max(0.02, gainRef * Math.pow(0.85, dt));   // baja despacio (~15% por segundo)
}

// Wallpaper Engine: 128 valores (0-63 canal izquierdo, 64-127 derecho). Los juntamos en 64.
if (inWE) {
  window.wallpaperRegisterAudioListener(arr => {
    const half = arr.length >> 1;
    const mono = new Array(half);
    for (let i = 0; i < half; i++) mono[i] = (arr[i] + arr[i + half]) / 2;
    livelyAudioListener(mono);
  });
}

// Wallpaper Engine: ajustes definidos en project.json (mismos nombres que en Lively).
window.wallpaperPropertyListener = {
  applyUserProperties(props) {
    for (const key in props) {
      let val = props[key].value;
      if (key === "imgFile" || key === "vidFile") {
        val = val ? "file:///" + val : (key === "imgFile" ? "images/default.svg" : "");
      }
      livelyPropertyListener(key, val);
    }
  }
};

function demoAudio(t) {
  const beat = Math.pow(Math.max(0, Math.sin(t * 4.2)), 8);
  for (let i = 0; i < raw.length; i++) {
    const x = i / raw.length;
    raw[i] = Math.max(0,
      (0.55 * (1 - x) + 0.15) *
      (0.45 + 0.35 * Math.sin(t * 2.1 + i * 0.35) + 0.25 * Math.sin(t * 5.3 - i * 0.12)) +
      beat * 0.5 * (1 - x));
  }
  lastAudio = performance.now();
}

// ---------- Barras ----------
let cur = [], peaks = [], peakHold = [];
function resetBars() {
  const n = Math.max(8, Math.round(cfg.barCount));
  cur = new Array(n).fill(0);
  peaks = new Array(n).fill(0);
  peakHold = new Array(n).fill(0);
}
resetBars();

const GLOW_SCALE = 0.25; // el brillo se dibuja a 1/4 de resolución y lo desenfoca la tarjeta gráfica
let W = 0, H = 0, AH = 0, maxH = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  maxH = H * cfg.barHeight / 100;
  AH = Math.ceil(maxH + 30); // alto de la franja de barras (+ espacio para los picos)
  canvas.style.height = AH + "px";
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(AH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pad = 40; // espacio para que el brillo se vea por encima de las barras
  glowCanvas.style.height = (AH + pad) + "px";
  glowCanvas.width = Math.max(1, Math.round(W * GLOW_SCALE));
  glowCanvas.height = Math.max(1, Math.round((AH + pad) * GLOW_SCALE));
  glowCanvas.style.filter = `blur(${Math.round(cfg.glow / 100 * 18)}px)`;
  glowCanvas.dataset.pad = pad;
}
window.addEventListener("resize", resize);
resize();

// Valor del espectro para la barra i, con más peso a los agudos (que suelen ser débiles).
function sampleBar(i, n) {
  const len = raw.length;
  const a = Math.floor(i / n * len);
  const b = Math.max(a + 1, Math.floor((i + 1) / n * len));
  let s = 0;
  for (let k = a; k < b && k < len; k++) s += raw[k];
  s /= (b - a);
  const boost = 1 + (i / n) * 1.6;
  const gain = (cfg.autoGain && !demoMode) ? 0.9 / gainRef : 1;
  return Math.min(1, s * boost * gain * cfg.sensitivity / 100);
}

function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  ctx.beginPath();
  if (r <= 0) { ctx.rect(x, y, w, h); return; }
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
}

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;

  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;

  if (demoMode) demoAudio(t);
  const silent = now - lastAudio > 1500;

  const n = cur.length;
  const half = Math.ceil(n / 2);
  const decay = 0.03 + 0.3 * (1 - cfg.smoothing / 100);

  for (let i = 0; i < n; i++) {
    let target;
    if (cfg.mirror) {
      const j = i < half ? half - 1 - i : i - half;  // graves al centro
      target = sampleBar(j, half);
    } else {
      target = sampleBar(i, n);
    }
    // La onda suave solo aparece cuando no suena nada; con música, las barras siguen el audio.
    if (silent) target = cfg.idleWave ? 0.025 + 0.02 * Math.sin(t * 1.5 + i * 0.25) : 0;

    cur[i] += (target - cur[i]) * (target > cur[i] ? 0.55 : decay);

    if (cur[i] >= peaks[i]) { peaks[i] = cur[i]; peakHold[i] = 0.35; }
    else if (peakHold[i] > 0) peakHold[i] -= dt;
    else peaks[i] = Math.max(cur[i], peaks[i] - dt * 0.45);
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, AH);
  const slot = W / n;
  const bw = Math.max(1, slot * (1 - cfg.gap / 100));
  const alpha = cfg.opacity / 100;
  const s = cfg.saturation, l = cfg.lightness;
  const radius = cfg.rounded ? bw / 2 : 0;
  const peakH = Math.max(2, bw * 0.18);

  for (let i = 0; i < n; i++) {
    const hue = (i / n * 360 + t * cfg.colorSpeed * 3) % 360;
    const h = Math.max(2, cur[i] * maxH);
    const x = i * slot + (slot - bw) / 2;

    ctx.fillStyle = `hsla(${hue},${s}%,${l}%,${alpha})`;
    barPath(x, AH - h, bw, h, radius);
    ctx.fill();

    if (cfg.peaks) {
      ctx.fillStyle = `hsla(${hue},${s}%,${Math.min(95, l + 10)}%,${Math.min(1, alpha + 0.25)})`;
      ctx.fillRect(x, AH - peaks[i] * maxH - 6, bw, peakH);
    }
  }

  // Desvanecido hacia abajo con un solo degradado para todas las barras (más ligero).
  ctx.globalCompositeOperation = "destination-in";
  const fade = ctx.createLinearGradient(0, AH - maxH - 10, 0, AH);
  fade.addColorStop(0, "rgba(0,0,0,1)");
  fade.addColorStop(1, "rgba(0,0,0,0.3)");
  ctx.fillStyle = fade;
  ctx.fillRect(0, 0, W, AH);
  ctx.globalCompositeOperation = "source-over";

  // Brillo: copia pequeña de las barras, desenfocada por la tarjeta gráfica.
  if (cfg.glow > 0) {
    glowCanvas.style.display = "block";
    const gw = glowCanvas.width, gh = glowCanvas.height;
    const padG = glowCanvas.dataset.pad * GLOW_SCALE;
    gctx.clearRect(0, 0, gw, gh);
    gctx.globalAlpha = Math.min(1, 0.4 + cfg.glow / 100);
    gctx.drawImage(canvas, 0, padG, gw, gh - padG);
  } else {
    glowCanvas.style.display = "none";
  }
}

applyBackground();
requestAnimationFrame(frame);
</script>
</body>
</html>
